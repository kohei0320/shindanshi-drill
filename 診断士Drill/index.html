<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  />

  <meta
    name="apple-mobile-web-app-title"
    content="診断士Drill"
  />

  <meta
    name="theme-color"
    content="#1f4b99"
  />

  <title>診断士Drill</title>

  <link
    rel="manifest"
    href="manifest.json"
  />

  <link
    rel="apple-touch-icon"
    href="icons/icon.svg"
  />

  <link
    rel="stylesheet"
    href="css/style.css"
  />
</head>

<body>

<main class="app">

  <!-- =========================
       エラー
       ========================= -->

  <p
    id="boot-error"
    class="error"
    hidden
  ></p>


  <!-- =========================
       HOME
       ========================= -->

  <section
    id="screen-home"
    class="screen"
  >

    <header class="header">
      <p class="eyebrow">
        中小企業診断士 1次試験
      </p>

      <h1>
        診断士Drill
      </h1>
    </header>


    <div class="cards">

      <article class="card">
        <p class="label">
          今日の学習
        </p>

        <p
          id="stat-today"
          class="value"
        >
          -
        </p>
      </article>


      <article class="card">
        <p class="label">
          累計正答率
        </p>

        <p
          id="stat-accuracy"
          class="value"
        >
          -
        </p>
      </article>


      <article class="card">
        <p class="label">
          累計回答数
        </p>

        <p
          id="stat-total"
          class="value"
        >
          -
        </p>
      </article>

    </div>


    <p
      id="resume-note"
      class="note"
      hidden
    ></p>


    <button
      id="btn-start-daily"
      class="btn primary"
      type="button"
    >
      今日の20問を始める
    </button>


    <button
      id="btn-extra-daily"
      class="btn"
      type="button"
      hidden
    >
      追加で20問解く
    </button>


    <button
      id="btn-review"
      class="btn"
      type="button"
    >
      間違えた問題を復習
    </button>


    <button
      id="btn-favorites"
      class="btn"
      type="button"
    >
      お気に入り
    </button>


    <!-- 自作問題 -->

    <button
      id="btn-create-question"
      class="btn"
      type="button"
    >
      ＋ 問題を作成
    </button>


    <button
      id="btn-manage-questions"
      class="btn"
      type="button"
    >
      📝 自作問題を管理
    </button>


    <!-- 科目別 -->

    <h2 class="section-title">
      科目別学習状況
    </h2>

    <div
      id="subject-stats"
      class="subject-stat-cards"
    ></div>


    <!-- 弱点分野 -->

    <h2 class="section-title">
      弱点分野
    </h2>

    <div
      id="weak-category-list"
      class="weak-category-list"
    ></div>

  </section>


  <!-- =========================
       SUBJECT
       ========================= -->

  <section
    id="screen-subject"
    class="screen"
    hidden
  >

    <div class="quiz-top">

      <button
        id="btn-subject-back"
        class="text-btn"
        type="button"
      >
        ホーム
      </button>

      <p
        id="subject-screen-title"
        class="progress"
      >
        科目
      </p>

      <span></span>

    </div>


    <h2 class="section-title">
      分野を選択
    </h2>


    <div
      id="category-list"
      class="category-list"
    ></div>

  </section>


  <!-- =========================
       CATEGORY
       ========================= -->

  <section
    id="screen-category"
    class="screen"
    hidden
  >

    <div class="quiz-top">

      <button
        id="btn-category-back"
        class="text-btn"
        type="button"
      >
        科目へ戻る
      </button>

      <p
        id="category-screen-title"
        class="progress"
      >
        分野
      </p>

      <span></span>

    </div>


    <div
      id="category-detail"
      class="category-detail"
    ></div>

  </section>


  <!-- =========================
       FAVORITES
       ========================= -->

  <section
    id="screen-favorites"
    class="screen"
    hidden
  >

    <div class="quiz-top">

      <button
        id="btn-favorites-back"
        class="text-btn"
        type="button"
      >
        ホーム
      </button>

      <p class="progress">
        お気に入り
      </p>

      <span></span>

    </div>


    <button
      id="btn-favorites-quiz"
      class="btn primary"
      type="button"
    >
      お気に入りを演習
    </button>


    <p
      id="favorites-empty"
      class="note"
    >
      お気に入りはまだありません。
      問題画面の☆から登録できます。
    </p>


    <ul
      id="favorites-list"
      class="favorite-list"
    ></ul>

  </section>


  <!-- =========================
       QUIZ
       ========================= -->

  <section
    id="screen-quiz"
    class="screen"
    hidden
  >

    <div class="quiz-top">

      <button
        id="btn-back-home"
        class="text-btn"
        type="button"
      >
        ホーム
      </button>

      <p
        id="quiz-progress"
        class="progress"
      >
        1 / 20
      </p>

      <button
        id="btn-favorite"
        class="star-btn"
        type="button"
        aria-label="お気に入り"
        aria-pressed="false"
      >
        ☆
      </button>

    </div>


    <p
      id="quiz-meta"
      class="meta"
    ></p>


    <h2
      id="quiz-question"
      class="question"
    ></h2>


    <div
      id="quiz-choices"
      class="choices"
    ></div>

  </section>


  <!-- =========================
       EXPLAIN
       ========================= -->

  <section
    id="screen-explain"
    class="screen"
    hidden
  >

    <p
      id="explain-badge"
      class="badge"
    ></p>


    <p
      id="explain-question"
      class="question small"
    ></p>


    <p
      id="explain-answer"
      class="answer"
    ></p>


    <!-- 正答解説 -->

    <div class="explain-section">

      <h3 class="explain-title">
        📖 正答解説
      </h3>

      <p
        id="explain-body"
        class="explanation"
      ></p>

    </div>


    <!-- 選択肢別解説 -->

    <div
      id="choice-explanations-section"
      class="explain-section"
      hidden
    >

      <h3 class="explain-title">
        🔎 選択肢を詳しく見る
      </h3>

      <div
        id="choice-explanations"
        class="choice-explanations"
      ></div>

    </div>


    <!-- この問題の核心 -->

    <div
      id="key-point-section"
      class="key-point"
      hidden
    >

      <h3>
        🎯 この問題の核心
      </h3>

      <p
        id="key-point"
      ></p>

    </div>


    <!-- 関連知識 -->

    <div
      id="related-knowledge-section"
      class="explain-section"
      hidden
    >

      <h3 class="explain-title">
        📚 関連知識
      </h3>

      <div
        id="related-knowledge"
        class="related-knowledge"
      ></div>

    </div>


    <!-- 間違いやすいポイント -->

    <div
      id="mistake-point-section"
      class="mistake-point"
      hidden
    >

      <h3>
        ⚠️ 間違いやすいポイント
      </h3>

      <p
        id="mistake-point"
      ></p>

    </div>


    <button
      id="btn-next"
      class="btn primary"
      type="button"
    >
      次の問題へ
    </button>

  </section>


  <!-- =========================
       CREATE / EDIT
       ========================= -->

  <section
    id="screen-create-question"
    class="screen"
    hidden
  >

    <div class="quiz-top">

      <button
        id="btn-create-question-back"
        class="text-btn"
        type="button"
      >
        ホーム
      </button>

      <p
        id="create-screen-title"
        class="progress"
      >
        問題を作成
      </p>

      <span></span>

    </div>


    <h2 class="section-title">
      <span id="create-form-heading">
        新しい問題
      </span>
    </h2>


    <div class="form-group">

      <label for="create-subject">
        科目
      </label>

      <select id="create-subject">
        <option value="">
          選択してください
        </option>
      </select>

    </div>


    <div class="form-group">

      <label for="create-category">
        分野
      </label>

      <input
        id="create-category"
        type="text"
        placeholder="例：GDP"
      />

    </div>


    <div class="form-group">

      <label for="create-difficulty">
        難易度
      </label>

      <select id="create-difficulty">

        <option value="1">
          1 - 基礎
        </option>

        <option
          value="2"
          selected
        >
          2 - 標準
        </option>

        <option value="3">
          3 - 応用
        </option>

      </select>

    </div>


    <div class="form-group">

      <label for="create-question">
        問題文
      </label>

      <textarea
        id="create-question"
        rows="5"
        placeholder="問題文を入力してください"
      ></textarea>

    </div>


    <div class="form-group">

      <label>
        選択肢
      </label>

      <input
        id="create-choice-0"
        type="text"
        placeholder="ア"
      />

      <input
        id="create-choice-1"
        type="text"
        placeholder="イ"
      />

      <input
        id="create-choice-2"
        type="text"
        placeholder="ウ"
      />

      <input
        id="create-choice-3"
        type="text"
        placeholder="エ"
      />

    </div>


    <div class="form-group">

      <label for="create-answer">
        正解
      </label>

      <select id="create-answer">

        <option value="0">
          ア
        </option>

        <option value="1">
          イ
        </option>

        <option value="2">
          ウ
        </option>

        <option value="3">
          エ
        </option>

      </select>

    </div>


    <div class="form-group">

      <label for="create-explanation">
        正答解説
      </label>

      <textarea
        id="create-explanation"
        rows="4"
        placeholder="なぜ正しいのか"
      ></textarea>

    </div>


    <div class="form-group">

      <label>
        選択肢別解説
      </label>

      <textarea
        id="create-choice-explanation-0"
        rows="3"
        placeholder="アの解説"
      ></textarea>

      <textarea
        id="create-choice-explanation-1"
        rows="3"
        placeholder="イの解説"
      ></textarea>

      <textarea
        id="create-choice-explanation-2"
        rows="3"
        placeholder="ウの解説"
      ></textarea>

      <textarea
        id="create-choice-explanation-3"
        rows="3"
        placeholder="エの解説"
      ></textarea>

    </div>


    <div class="form-group">

      <label for="create-key-point">
        この問題の核心
      </label>

      <textarea
        id="create-key-point"
        rows="3"
        placeholder="この問題で覚えるべき核心"
      ></textarea>

    </div>


    <div class="form-group">

      <label for="create-related">
        関連知識
      </label>

      <textarea
        id="create-related"
        rows="5"
        placeholder="関連する知識を入力してください&#10;1行につき1項目"
      ></textarea>

    </div>


    <button
      id="btn-save-question"
      class="btn primary"
      type="button"
    >
      問題を保存
    </button>


    <button
      id="btn-delete-editing-question"
      class="btn danger"
      type="button"
      hidden
    >
      この問題を削除
    </button>

  </section>


  <!-- =========================
       自作問題管理
       ========================= -->

  <section
    id="screen-manage-questions"
    class="screen"
    hidden
  >

    <div class="quiz-top">

      <button
        id="btn-manage-back"
        class="text-btn"
        type="button"
      >
        ホーム
      </button>

      <p class="progress">
        自作問題管理
      </p>

      <span></span>

    </div>


    <div class="manage-header">

      <h2 class="section-title">
        自作問題
      </h2>

      <p
        id="custom-question-count"
        class="note"
      >
        0問
      </p>

    </div>


    <input
      id="custom-question-search"
      class="search-input"
      type="search"
      placeholder="問題文・分野・科目を検索"
    />


    <button
      id="btn-create-from-manage"
      class="btn primary"
      type="button"
    >
      ＋ 新しい問題を作成
    </button>


    <div
      id="custom-question-list"
      class="custom-question-list"
    ></div>

  </section>


  <!-- =========================
       RESULT
       ========================= -->

  <section
    id="screen-result"
    class="screen"
    hidden
  >

    <h2>
      今回の結果
    </h2>


    <p
      id="result-score"
      class="value large"
    ></p>


    <p
      id="result-accuracy"
      class="note"
    ></p>


    <button
      id="btn-home"
      class="btn primary"
      type="button"
    >
      ホームへ戻る
    </button>

  </section>

</main>


<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/selector.js"></script>
<script src="js/stats.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>

</body>
</html>
